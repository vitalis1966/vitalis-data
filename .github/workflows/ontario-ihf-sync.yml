name: Sync Ontario IHF Facilities

on:
  schedule:
    - cron: '0 6 1 * *'    # First of every month at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download and filter IHF facilities
        run: python3 scripts/ontario_ihf_sync.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ontario-ihf/Facilities.csv
          git diff --staged --quiet || git commit -m "chore: update Ontario IHF facilities $(date -u +%Y-%m-%d)"
          git push
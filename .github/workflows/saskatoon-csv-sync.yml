name: Sync Saskatoon Building Permits CSV

on:
  schedule:
    - cron: '0 6 * * 2'   # Every Tuesday 6am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Download and convert Saskatoon building permits to CSV
        run: |
          python3 - <<'EOF'
          import requests, os

          url = "https://data-cos-gis.opendata.arcgis.com/api/download/v1/items/68ba7b38073f4cd4aee38d2b59afcaf4/csv?layers=12"
          print(f"Downloading Saskatoon building permits CSV...")
          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=120, allow_redirects=True)
          print(f"Status: {r.status_code}, Size: {len(r.content)} bytes")
          print(f"Content-Type: {r.headers.get('content-type','')}")
          r.raise_for_status()

          os.makedirs("saskatoon", exist_ok=True)
          out_path = "saskatoon/BuildingPermits.csv"
          with open(out_path, "wb") as f:
            f.write(r.content)

          # Print first 2 lines to verify
          with open(out_path, "r", encoding="utf-8") as f:
            for i, line in enumerate(f):
              if i < 2:
                print(f"Line {i}: {line[:200]}")
              else:
                break
          print(f"Done: {out_path}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saskatoon/
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet || git commit -m "Auto-update Saskatoon building permits CSV"
          git push

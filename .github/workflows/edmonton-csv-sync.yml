name: Sync Edmonton Building Permits

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Edmonton Building Permits
        run: |
          mkdir -p edmonton
          curl -s "https://data.edmonton.ca/resource/jsf3-5dv2.json?\$limit=50000&\$order=permit_date+DESC" \
            -H "Accept: application/json" -o edmonton/bp_raw.json
          python3 -c "
import json, csv, sys
with open('edmonton/bp_raw.json') as f:
    data = json.load(f)
if not data:
    sys.exit(0)
keys = list(data[0].keys())
with open('edmonton/BuildingPermits.csv', 'w', newline='') as out:
    writer = csv.DictWriter(out, fieldnames=keys)
    writer.writeheader()
    for row in data:
        if 'location' in row and isinstance(row['location'], dict):
            row['location'] = str(row['location'].get('human_address', ''))
        writer.writerow({k: row.get(k, '') for k in keys})
"

      - name: Fetch Edmonton Development Permits
        run: |
          curl -s "https://data.edmonton.ca/resource/2ccn-pwtu.json?\$limit=50000&\$order=permit_date+DESC" \
            -H "Accept: application/json" -o edmonton/dev_raw.json
          python3 -c "
import json, csv, sys
with open('edmonton/dev_raw.json') as f:
    data = json.load(f)
if not data:
    sys.exit(0)
keys = list(data[0].keys())
with open('edmonton/DevPermits.csv', 'w', newline='') as out:
    writer = csv.DictWriter(out, fieldnames=keys)
    writer.writeheader()
    for row in data:
        if 'location' in row and isinstance(row['location'], dict):
            row['location'] = str(row['location'].get('human_address', ''))
        writer.writerow({k: row.get(k, '') for k in keys})
"

      - name: Cleanup raw JSON
        run: rm -f edmonton/bp_raw.json edmonton/dev_raw.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add edmonton/
          git diff --staged --quiet || git commit -m "chore: sync Edmonton permits $(date -u +%Y-%m-%d)"
          git push
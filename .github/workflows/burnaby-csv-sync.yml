name: Sync Burnaby Building Permits

on:
  schedule:
    - cron: '0 8 * * 2-6'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber requests

      - name: Download and parse Burnaby permits
        run: python3 scripts/burnaby_sync.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add burnaby/BuildingPermits.csv
          git diff --staged --quiet || git commit -m "chore: update Burnaby permits $(date -u +%Y-%m-%d)"
          git push
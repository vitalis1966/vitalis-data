name: Sync Burnaby Building Permits

on:
  schedule:
    - cron: '0 8 * * 2-6'    # Tue-Sat 08:00 UTC (covers Mon-Fri permits)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Download and parse Burnaby permits
        run: |
          python3 - <<'EOF'
          import pdfplumber, requests, csv, os, re
          from datetime import datetime, timedelta
          from bs4 import BeautifulSoup

          LISTING_URL = "https://www.burnaby.ca/services-and-payments/permits-and-applications/building-permits-issued-and-tabulation-reports"

          HEALTH_KEYWORDS = [
              "medical", "dental", "clinic", "health", "pharmacy", "optom",
              "veterinary", "vet ", "physician", "doctor", "surgical",
              "imaging", "diagnostic", "laboratory", "physio", "chiro",
              "massage", "therapy", "therapist", "hospital", "care centre",
              "care center", "wellness", "rehabilitation", "rehab",
          ]

          def is_health(text):
              t = text.lower()
              return any(kw in t for kw in HEALTH_KEYWORDS)

          # Get listing page to find recent PDF URLs
          print("Fetching listing page...")
          resp = requests.get(LISTING_URL, timeout=30)
          soup = BeautifulSoup(resp.text, "html.parser")

          # Find all PDF links from the past 7 days
          today = datetime.utcnow()
          pdf_urls = []
          for a in soup.find_all("a", href=True):
              href = a["href"]
              if ".pdf" in href.lower() and "acquiadam" in href:
                  full_url = href if href.startswith("http") else f"https://www.burnaby.ca{href}"
                  pdf_urls.append(full_url)

          # Limit to last 7 (one week of weekdays)
          pdf_urls = pdf_urls[:7]
          print(f"Found {len(pdf_urls)} recent PDFs")

          os.makedirs("burnaby", exist_ok=True)
          all_rows = []

          for pdf_url in pdf_urls:
              print(f"Processing: {pdf_url}")
              try:
                  r = requests.get(pdf_url, timeout=60)
                  if not r.ok:
                      print(f"  HTTP {r.status_code} — skipping")
                      continue

                  # Extract date from URL
                  date_match = re.search(r'(\d{4}-\d{2})/(\w+)-(\d+)-(\d{4})\.pdf', pdf_url)
                  permit_date = date_match.group(0)[:10] if date_match else "unknown"

                  with pdfplumber.open(requests.get(pdf_url, stream=True).raw) as pdf:
                      for page in pdf.pages:
                          table = page.extract_table()
                          if not table:
                              continue
                          for row in table[1:]:  # skip header
                              if not row or all(c is None for c in row):
                                  continue
                              row_text = " ".join(str(c or "") for c in row)
                              if is_health(row_text):
                                  # Columns: address, legal_desc, zone, permit_number,
                                  #          permit_category, type_of_change, value, units
                                  all_rows.append({
                                      "permit_date": permit_date,
                                      "address": str(row[0] or "").strip(),
                                      "legal_description": str(row[1] or "").strip(),
                                      "zone": str(row[2] or "").strip(),
                                      "permit_number": str(row[3] or "").strip(),
                                      "permit_category": str(row[4] or "").strip(),
                                      "type_of_change": str(row[5] or "").strip(),
                                      "value_of_work": str(row[6] or "").strip(),
                                      "num_units": str(row[7] or "").strip(),
                                      "full_text": row_text.strip(),
                                      "source_url": pdf_url,
                                  })
                              
              except Exception as e:
                  print(f"  Error: {e}")

          print(f"\nHealth-related permits found: {len(all_rows)}")

          # Write CSV
          outfile = "burnaby/BuildingPermits.csv"
          fieldnames = ["permit_date","address","legal_description","zone","permit_number",
                        "permit_category","type_of_change","value_of_work","num_units",
                        "full_text","source_url"]

          # Load existing CSV to avoid duplicates
          existing = set()
          if os.path.exists(outfile):
              with open(outfile, newline="", encoding="utf-8") as f:
                  for r in csv.DictReader(f):
                      existing.add(r.get("permit_number",""))

          new_rows = [r for r in all_rows if r["permit_number"] not in existing]
          print(f"New rows to add: {len(new_rows)}")

          # Append new rows
          write_header = not os.path.exists(outfile)
          with open(outfile, "a", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              if write_header:
                  writer.writeheader()
              writer.writerows(new_rows)

          print(f"Done. Total rows in file: {sum(1 for _ in open(outfile)) - 1}")
          EOF

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add burnaby/BuildingPermits.csv
          git diff --staged --quiet || git commit -m "chore: update Burnaby permits $(date -u +%Y-%m-%d)"
          git push
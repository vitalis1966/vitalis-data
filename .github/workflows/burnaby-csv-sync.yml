name: Sync Burnaby Building Permits

on:
  schedule:
    - cron: '0 8 * * 2-6'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber requests

      - name: Download and parse Burnaby permits
        run: |
          python3 - <<'EOF'
          import pdfplumber, requests, csv, os, re, io
          from datetime import datetime, timedelta

          HEALTH_KEYWORDS = [
              "medical", "dental", "clinic", "health", "pharmacy", "optom",
              "veterinary", "vet ", "physician", "doctor", "surgical",
              "imaging", "diagnostic", "laboratory", "physio", "chiro",
              "massage", "therapy", "therapist", "hospital", "care centre",
              "care center", "wellness", "rehabilitation", "rehab",
          ]

          def is_health(text):
              t = text.lower()
              return any(kw in t for kw in HEALTH_KEYWORDS)

          MONTHS = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"]

          today = datetime.utcnow()
          pdf_urls = []
          for days_back in range(7):
              d = today - timedelta(days=days_back)
              if d.weekday() >= 5:
                  continue
              month_name = MONTHS[d.month - 1]
              folder = f"{d.year}-{d.month:02d}"
              filename = f"{month_name}-{d.day}-{d.year}.pdf"
              url = f"https://www.burnaby.ca/sites/default/files/acquiadam/{folder}/{filename}"
              pdf_urls.append(url)

          print(f"Generated {len(pdf_urls)} PDF URLs to check")

          os.makedirs("burnaby", exist_ok=True)
          all_rows = []
          debug_done = False

          for pdf_url in pdf_urls:
              print(f"Processing: {pdf_url}")
              try:
                  r = requests.get(pdf_url, timeout=60)
                  if not r.ok:
                      print(f"  HTTP {r.status_code} — skipping")
                      continue

                  date_match = re.search(r'(\d{4}-\d{2})/\w+-(\d+)-(\d{4})\.pdf', pdf_url)
                  month_folder = date_match.group(1) if date_match else "unknown"
                  day = date_match.group(2) if date_match else "?"
                  permit_date = f"{month_folder}-{int(day):02d}"

                  with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                      print(f"  Pages: {len(pdf.pages)}")
                      for page_num, page in enumerate(pdf.pages):
                          table = page.extract_table()
                          text = page.extract_text()

                          if not debug_done and page_num == 0:
                              print(f"  DEBUG table rows: {len(table) if table else 'None'}")
                              print(f"  DEBUG text (first 800 chars):")
                              print(text[:800] if text else "  [no text]")
                              debug_done = True

                          if table and len(table) > 1:
                              for row in table[1:]:
                                  if not row or all(c is None for c in row):
                                      continue
                                  row_text = " ".join(str(c or "") for c in row)
                                  if is_health(row_text):
                                      all_rows.append({
                                          "permit_date": permit_date,
                                          "address": str(row[0] or "").strip(),
                                          "permit_number": str(row[3] or "").strip() if len(row) > 3 else "",
                                          "permit_category": str(row[4] or "").strip() if len(row) > 4 else "",
                                          "type_of_change": str(row[5] or "").strip() if len(row) > 5 else "",
                                          "value_of_work": str(row[6] or "").strip() if len(row) > 6 else "",
                                          "full_text": row_text.strip(),
                                          "source_url": pdf_url,
                                      })
                          elif text:
                              for line in text.split("\n"):
                                  if is_health(line):
                                      all_rows.append({
                                          "permit_date": permit_date,
                                          "address": "",
                                          "permit_number": "",
                                          "permit_category": "",
                                          "type_of_change": "",
                                          "value_of_work": "",
                                          "full_text": line.strip(),
                                          "source_url": pdf_url,
                                      })

              except Exception as e:
                  print(f"  Error: {e}")

          print(f"\nHealth-related permits found: {len(all_rows)}")

          outfile = "burnaby/BuildingPermits.csv"
          fieldnames = ["permit_date","address","permit_number","permit_category",
                        "type_of_change","value_of_work","full_text","source_url"]

          existing = set()
          if os.path.exists(outfile):
              with open(outfile, newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      existing.add(row.get("full_text",""))

          new_rows = [r for r in all_rows if r["full_text"] not in existing]
          print(f"New rows to add: {len(new_rows)}")

          write_header = not os.path.exists(outfile)
          with open(outfile, "a", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              if write_header:
                  writer.writeheader()
              writer.writerows(new_rows)

          print(f"Done. Total rows: {sum(1 for _ in open(outfile)) - 1}")
          EOF

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config
name: Sync Ottawa Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'   # Every Wednesday 7am UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests
      - name: Download Ottawa Building Permits
        run: |
          python3 - <<'EOF'
          import requests, csv, io, os

          MED_TERMS = [
            "medical","physician","dental","clinic","health centre","health center",
            "optom","physiotherapy","pharmacy","chiropractic","radiolog","diagnostic",
            "laboratory","outpatient","nursing","ophthalmolog","physio","audiolog",
            "speech therapy","medical building","doctor","allied health",
            "health care service","health care","veterinary","veterinarian",
            "animal hospital","pet clinic","animal clinic","animal care","vet clinic",
          ]

          url = "https://open.ottawa.ca/api/explore/v2.1/catalog/datasets/building-permits-de-construction/exports/csv?lang=en&timezone=America%2FToronto&use_labels=true&delimiter=%2C"
          print("Downloading Ottawa building permits...")
          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=300, stream=True)
          print(f"Status: {r.status_code}")
          r.raise_for_status()

          os.makedirs("ottawa", exist_ok=True)
          out_path = "ottawa/BuildingPermits.csv"

          content = r.content.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(content))
          matched = 0
          total = 0
          all_keys = []
          seen_keys = set()
          matched_rows = []

          for row in reader:
            total += 1
            desc = (row.get("Description") or row.get("description") or
                    row.get("Work Description") or row.get("work_description") or
                    row.get("Permit Type") or row.get("permit_type") or "").lower()
            if any(t in desc for t in MED_TERMS):
              for k in row.keys():
                if k not in seen_keys:
                  all_keys.append(k)
                  seen_keys.add(k)
              matched_rows.append(row)
              matched += 1

          with open(out_path, "w", newline="", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=all_keys, extrasaction="ignore")
            writer.writeheader()
            for row in matched_rows:
              writer.writerow({k: row.get(k, "") for k in all_keys})

          print(f"Done: {total} total, {matched} matched → {out_path}")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ottawa/
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet || git commit -m "Auto-update Ottawa building permits CSV"
          git push
name: Sync Ottawa Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'   # Every Wednesday 7am UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests openpyxl
      - name: Download and filter Ottawa Building Permits
        run: |
          python3 - <<'EOF'
          import requests, csv, os, openpyxl, io

          MED_TERMS = [
            "medical","physician","dental","clinic","health centre","health center",
            "optom","physiotherapy","pharmacy","chiropractic","radiolog","diagnostic",
            "laboratory","outpatient","nursing","ophthalmolog","physio","audiolog",
            "speech therapy","medical building","doctor","allied health",
            "health care service","health care","veterinary","veterinarian",
            "animal hospital","pet clinic","animal clinic","animal care","vet clinic",
          ]

          # Ottawa publishes monthly Excel files — download the 2024-2025 combined file
          # Document ID: 05046d836248455d92cbc0543ce4c022
          EXCEL_URLS = [
            "https://open.ottawa.ca/documents/05046d836248455d92cbc0543ce4c022/download",
            "https://open.ottawa.ca/documents/ottawa-building-permits-2023/download",
          ]

          os.makedirs("ottawa", exist_ok=True)
          out_path = "ottawa/BuildingPermits.csv"

          all_keys = []
          seen_keys = set()
          matched_rows = []
          total = 0
          matched = 0

          for url in EXCEL_URLS:
            print(f"Trying: {url}")
            try:
              r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=120)
              print(f"Status: {r.status_code} Content-Type: {r.headers.get('content-type','')}")
              if r.status_code != 200:
                print(f"Skipping — not found")
                continue
              if "excel" not in r.headers.get("content-type","") and "spreadsheet" not in r.headers.get("content-type",""):
                print(f"Not Excel — content-type: {r.headers.get('content-type','')}")
                continue
              wb = openpyxl.load_workbook(io.BytesIO(r.content), read_only=True, data_only=True)
              # Try "Details" sheet first, fall back to first sheet
              ws = wb["Details"] if "Details" in wb.sheetnames else wb.active
              headers = None
              for row in ws.iter_rows(values_only=True):
                if headers is None:
                  headers = [str(c).strip() if c is not None else "" for c in row]
                  print(f"Headers: {headers}")
                  continue
                total += 1
                row_dict = dict(zip(headers, [str(c).strip() if c is not None else "" for c in row]))
                desc = (row_dict.get("Description") or row_dict.get("Work") or "").lower()
                btype = (row_dict.get("Building Type") or row_dict.get("BuildingType") or "").lower()
                combined = f"{desc} {btype}"
                if any(t in combined for t in MED_TERMS):
                  for k in row_dict.keys():
                    if k not in seen_keys:
                      all_keys.append(k)
                      seen_keys.add(k)
                  matched_rows.append(row_dict)
                  matched += 1
              wb.close()
            except Exception as e:
              print(f"Error: {e}")
              continue

          if matched_rows:
            with open(out_path, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=all_keys, extrasaction="ignore")
              writer.writeheader()
              for row in matched_rows:
                writer.writerow({k: row.get(k, "") for k in all_keys})

          print(f"Done: {total} total, {matched} matched → {out_path}")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ottawa/
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet || (git commit -m "Auto-update Ottawa building permits CSV" && git push)
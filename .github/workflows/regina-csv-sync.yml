name: Sync Regina Building Permits CSV

on:
  schedule:
    - cron: '0 8 * * 5'   # Every Friday 8am UTC (Regina updates Thursdays)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Download and convert Regina 2026 XLSX to CSV
        run: |
          python3 - <<'EOF'
          import requests, openpyxl, io, csv, os

          url = "https://openregina.ca/dataset/c5ffc5b5-7448-4dfa-9962-ca1b6396adb6/resource/dcea70fc-87dd-4e04-bc34-b3ce6580daac/download/building-permit-report-2026-32.xlsx"
          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
          r.raise_for_status()
          wb = openpyxl.load_workbook(io.BytesIO(r.content), read_only=True, data_only=True)
          ws = wb.active
          os.makedirs("regina", exist_ok=True)
          with open("regina/BuildingPermits2026.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  if any(cell is not None for cell in row):
                      writer.writerow([str(c) if c is not None else "" for c in row])
          wb.close()
          print("Done: regina/BuildingPermits2026.csv")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regina/BuildingPermits2026.csv
          git diff --staged --quiet || git commit -m "Auto-update Regina building permits 2026"
          git push

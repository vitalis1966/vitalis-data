name: Sync London Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests
      - name: Download London Building Permits
        run: |
          python3 - <<'EOF'
          import requests, csv, io, os
          MED_TERMS = [
            "medical","physician","dental","clinic","health centre","health center",
            "optom","physiotherapy","pharmacy","chiropractic","radiolog","diagnostic",
            "laboratory","outpatient","nursing","ophthalmolog","physio","audiolog",
            "speech therapy","medical building","doctor","allied health",
            "health care service","health care","veterinary","veterinarian",
            "animal hospital","pet clinic","animal clinic","animal care","vet clinic",
          ]
          url = "https://opendata.london.ca/api/download/v1/items/cb618c6b5f8f46b696674e74a3fb5b2d/csv?layers=0"
          print("Downloading London ON building permits...")
          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=300, stream=True)
          print(f"Status: {r.status_code} Content-Type: {r.headers.get('content-type','')}")
          r.raise_for_status()
          # Print headers and first 3 rows for diagnostics
          content = r.content.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(content))
          print(f"Headers: {reader.fieldnames}")
          for i, row in enumerate(reader):
            if i < 3:
              print(f"Row {i}: {dict(row)}")
            else:
              break
          import sys; sys.exit(0)
          os.makedirs("london", exist_ok=True)
          out_path = "london/BuildingPermits.csv"
          content = r.content.decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(content))
          print(f"Headers: {reader.fieldnames}")
          all_keys = []
          seen_keys = set()
          matched_rows = []
          total = 0
          for row in reader:
            total += 1
            desc = " ".join([
              row.get("DESCRIPTION") or row.get("description") or row.get("work_type") or row.get("WORK_TYPE") or "",
              row.get("BUILDING_USE") or row.get("building_use") or row.get("USE") or row.get("use") or "",
              row.get("PERMIT_TYPE") or row.get("permit_type") or "",
            ]).lower()
            if any(t in desc for t in MED_TERMS):
              for k in row.keys():
                if k not in seen_keys:
                  all_keys.append(k)
                  seen_keys.add(k)
              matched_rows.append(row)
          with open(out_path, "w", newline="", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=all_keys, extrasaction="ignore")
            writer.writeheader()
            for row in matched_rows:
              writer.writerow({k: row.get(k, "") for k in all_keys})
          print(f"Done: {total} total, {len(matched_rows)} matched")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add london/
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git diff --staged --quiet || (git commit -m "update london permits" && git push) || true
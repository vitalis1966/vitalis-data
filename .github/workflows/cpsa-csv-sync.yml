name: Sync CPSA Physician CSV

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CPSA Physician Directory CSV
        run: |
          mkdir -p cpsa
          curl -fL \
            "https://search.cpsa.ca/api/PhysicianSearch/ExportData?format=csv&province=AB" \
            -H "Accept: text/csv" \
            -o cpsa/Physicians.csv
          echo "Downloaded $(wc -l < cpsa/Physicians.csv) rows"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpsa/Physicians.csv
          git diff --staged --quiet || git commit -m "chore: update CPSA physician data $(date -u +%Y-%m-%d)"
          git push
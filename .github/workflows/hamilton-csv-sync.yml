name: Sync Hamilton Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests
      - name: Decode Hamilton permits
        run: |
          python3 - <<'EOF'
          import requests, json, csv, os

          headers = {"User-Agent": "Mozilla/5.0"}

          # Fetch the encoded data file
          r = requests.get(
            "https://data.thepublicrecord.ca/buildingpermits/data/permits.json?v=2026-07.1",
            headers=headers, timeout=60
          )
          print(f"permits.json status: {r.status_code}, size: {len(r.content)} bytes")
          d = r.json()
          print(f"Top-level keys: {list(d.keys())[:20]}")
          print(f"Sample of d: {str(d)[:500]}")
          EOF
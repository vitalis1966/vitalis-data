name: Sync Hamilton Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests
      - name: Download and filter Hamilton Building Permits
        run: |
          python3 - <<'EOF'
          import requests, json, csv, os

          MED_TERMS = [
            "medical","physician","dental","clinic","health centre","health center",
            "optom","physiotherapy","pharmacy","chiropractic","radiolog","diagnostic",
            "laboratory","outpatient","nursing","ophthalmolog","physio","audiolog",
            "speech therapy","medical building","doctor","allied health",
            "health care service","health care","veterinary","veterinarian",
            "animal hospital","pet clinic","animal clinic","animal care","vet clinic",
          ]

          print("Fetching Hamilton permits.json...")
          r = requests.get(
            "https://data.thepublicrecord.ca/buildingpermits/data/permits.json?v=2026-07.1",
            headers={"User-Agent": "Mozilla/5.0"}, timeout=120
          )
          r.raise_for_status()
          d = r.json()

          periods = d["periods"]
          areas = d["areas"]
          btypes = d["building_types"]
          wtypes = d["work_types"]
          fields = d["fields"]
          rows = d["rows"]

          print(f"Total rows: {len(rows)}")

          os.makedirs("hamilton", exist_ok=True)
          out_path = "hamilton/BuildingPermits.csv"

          matched = 0
          matched_rows = []

          for row in rows:
            period = periods[row[0]]
            address = row[1]
            area = areas[row[2]]
            btype = btypes[row[3]]
            wtype = wtypes[row[4]]
            value = row[5]
            lat = row[6]
            lng = row[7]
            permit_no = row[8] if len(row) > 8 else ""
            unit = row[9] if len(row) > 9 else ""

            combined = f"{wtype} {btype}".lower()
            if any(t in combined for t in MED_TERMS):
              matched_rows.append({
                "period": period,
                "address": address,
                "unit": unit or "",
                "area": area,
                "building_type": btype,
                "work_type": wtype,
                "value": value or "",
                "lat": lat or "",
                "lng": lng or "",
                "permit_no": permit_no or "",
              })
              matched += 1

          with open(out_path, "w", newline="", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=["period","address","unit","area","building_type","work_type","value","lat","lng","permit_no"])
            writer.writeheader()
            writer.writerows(matched_rows)

          print(f"Done: {len(rows)} total, {matched} matched → {out_path}")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hamilton/
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git diff --staged --quiet || (git commit -m "Auto-update Hamilton building permits CSV" && git push)
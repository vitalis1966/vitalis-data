name: Sync Hamilton Building Permits CSV
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install requests
      - name: Parse explorer page for data URLs
        run: |
          python3 - <<'EOF'
          import requests, re

          r = requests.get(
            "https://data.thepublicrecord.ca/buildingpermits/explorer",
            headers={"User-Agent": "Mozilla/5.0"},
            timeout=30
          )
          print(f"Status: {r.status_code}")
          print(r.text)
          EOF